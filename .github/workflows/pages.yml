# Builds the game and publishes it to GitHub Pages on every push to main. The
# build runs `tsc --noEmit` before Vite, so a type error stops the deploy rather
# than shipping a blank canvas.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys with an OIDC token, which is what id-token: write is for.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins: the artifact is the whole site,
# so an older run finishing late would publish a stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
